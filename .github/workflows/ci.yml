name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, tag: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, tag: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, tag: windows-x86_64 }
          - { os: macos-13, target: x86_64-apple-darwin, tag: macos-x86_64 }
          - { os: macos-14, target: aarch64-apple-darwin, tag: macos-aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: lavatex-${{ matrix.tag }}
          path: target/${{ matrix.target }}/release/lavatex${{ runner.os == 'Windows' && '.exe' || '' }}

  integration:
    name: Integration (TeX Live + LibreOffice + Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install TeX Live, LibreOffice and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-xetex dvisvgm dvipng poppler-utils \
            libreoffice-impress python3-uno
      - run: cargo build
      - name: Render matrix smoke test
        run: |
          for e in latex pdflatex xelatex lualatex; do
            for f in svg pdf png; do
              target/debug/lavatex render 'E=mc^2' --engine $e -f $f -o "out-$e.$f"
              target/debug/lavatex inspect "out-$e.$f" > /dev/null
            done
          done
      - name: LibreOffice end-to-end
        run: python3 hosts/libreoffice/tests/test_headless.py --core target/debug/lavatex
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ONLYOFFICE plugin tests
        run: |
          node --test hosts/onlyoffice/tests/core.test.js
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node hosts/onlyoffice/tests/e2e.js target/debug/lavatex

  package:
    name: Packages
    needs: [core, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bins
      - name: Build .oxt (per platform and multi) and ONLYOFFICE .plugin
        run: |
          args=()
          for dir in bins/lavatex-*; do
            tag=${dir#bins/lavatex-}
            exe=$(ls "$dir"/lavatex* | head -n1)
            python3 tools/package.py libreoffice --bin "$tag=$exe"
            args+=(--bin "$tag=$exe")
          done
          python3 tools/package.py libreoffice "${args[@]}"
          python3 tools/package.py onlyoffice
          for dir in bins/lavatex-*; do
            tag=${dir#bins/lavatex-}
            (cd "$dir" && zip -q "../../dist/lavatex-cli-$tag.zip" lavatex*)
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: lavatex-packages
          path: dist/*
