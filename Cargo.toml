[workspace]
resolver = "2"
members = ["crates/lavatex-core", "crates/lavatex-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lavakumarveludandi/lavatex"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = true
strip = true
codegen-units = 1
