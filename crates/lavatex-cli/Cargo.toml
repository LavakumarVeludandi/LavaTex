[package]
name = "lavatex-cli"
description = "LavaTeX command-line tool and local render helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lavatex_cli"
path = "src/lib.rs"

[[bin]]
name = "lavatex"
path = "src/main.rs"

[[bin]]
name = "lavatex-helper"
path = "src/bin/lavatex-helper.rs"

[dependencies]
lavatex-core = { path = "../lavatex-core" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"
getrandom = "0.2"
# HTTPS for the PowerPoint add-in (Office requires HTTPS add-in pages).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }

[dev-dependencies]
tempfile = "3"
