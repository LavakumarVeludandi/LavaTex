<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LavaTeX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="editor.css">
  <script src="lavatex-core.js"></script>
  <script src="editor.js"></script>
</head>
<body>
  <main class="lt">
    <div id="banner" class="banner" role="status" hidden></div>

    <label for="source" class="lbl">LaTeX source</label>
    <textarea id="source" class="code" rows="6" spellcheck="false"
      aria-describedby="sourceHint" placeholder="\frac{-b \pm \sqrt{b^2-4ac}}{2a}"></textarea>
    <div id="sourceHint" class="hint">End a line with <code>\\</code> for a new line; use <code>&amp;</code> to line up lines (e.g. at <code>=</code>). Ctrl+Enter inserts, Esc cancels.</div>

    <details id="preambleBox">
      <summary>Preamble (packages and macros)</summary>
      <textarea id="preamble" class="code" rows="3" spellcheck="false" aria-label="Preamble"></textarea>
    </details>

    <div class="options">
      <label>Mode
        <select id="mode">
          <option value="display">Display</option>
          <option value="inline">Inline</option>
          <option value="text">Text (raw LaTeX)</option>
        </select>
      </label>
      <label>Size (pt)
        <input id="fontSize" type="number" min="1" max="500" step="1">
      </label>
      <label>Color
        <input id="color" type="color">
      </label>
      <label>Output
        <select id="format">
          <option value="svg">SVG (vector)</option>
          <option value="png">PNG (bitmap)</option>
        </select>
      </label>
      <label id="dpiLabel">dpi
        <input id="pngDpi" type="number" min="36" max="2400" step="1">
      </label>
    </div>
    <div class="options">
      <label class="grow">TeX
        <select id="toolchain"><option value="">Automatic</option></select>
      </label>
      <label>Engine
        <select id="engine">
          <option value="">Automatic</option>
          <option value="latex">latex</option>
          <option value="pdflatex">pdflatex</option>
          <option value="xelatex">xelatex</option>
          <option value="lualatex">lualatex</option>
          <option value="tectonic">tectonic</option>
        </select>
      </label>
    </div>

    <div id="preview" class="preview" aria-label="Preview"><span class="placeholder">Type LaTeX above to see a preview.</span></div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <details id="detailsBox" hidden>
      <summary>Details</summary>
      <pre id="details"></pre>
    </details>

    <div class="buttons">
      <button id="insert" type="button" class="btn primary">Insert</button>
      <button id="cancel" type="button" class="btn">Cancel</button>
    </div>
  </main>
</body>
</html>
